[workspace]
resolver = "2"
members = [
    "crates/ifa-span",
    "crates/ifa-diagnostics",
    "crates/ifa-lexer",
    "crates/ifa-ast",
    "crates/ifa-parser",
    "crates/ifa-sema",
    "crates/ifa-comptime",
    "crates/ifa-fir",
    "crates/ifa-runtime",
    "crates/ifa-codegen-cranelift",
    "crates/ifa-codegen-llvm",
    "crates/ifa-cli",
    "crates/kori",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ASSOGBA Prudence Dieudonné <jprud67@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ifa-lang/ifa"
homepage = "https://github.com/ifa-lang/ifa"
readme = "README.md"
description = "IFA Programming Language: deterministic, zero GC, zero borrow-checker systems programming language."

[workspace.dependencies]
lasso = { version = "0.7", features = ["multi-threaded"] }
lazy_static = "1.4"
ariadne = "0.4"
logos = "0.14"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
petgraph = "0.7"
cranelift-codegen = "0.138.0-rc.1"
cranelift-frontend = "0.138.0-rc.1"
cranelift-module = "0.138.0-rc.1"
cranelift-native = "0.138.0-rc.1"
cranelift-jit = "0.138.0-rc.1"
cranelift-object = "0.138.0-rc.1"
target-lexicon = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
blake3 = "1.5"
semver = { version = "1.0", features = ["serde"] }

# Internal workspace crates
ifa-span = { path = "crates/ifa-span" }
ifa-diagnostics = { path = "crates/ifa-diagnostics" }
ifa-lexer = { path = "crates/ifa-lexer" }
ifa-ast = { path = "crates/ifa-ast" }
ifa-parser = { path = "crates/ifa-parser" }
ifa-sema = { path = "crates/ifa-sema" }
ifa-comptime = { path = "crates/ifa-comptime" }
ifa-fir = { path = "crates/ifa-fir" }
ifa-runtime = { path = "crates/ifa-runtime" }
ifa-codegen-cranelift = { path = "crates/ifa-codegen-cranelift" }
ifa-codegen-llvm = { path = "crates/ifa-codegen-llvm" }
kori = { path = "crates/kori" }
