name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Git tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux-x86_64:
    name: Build & Package (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q lld clang
      - name: Package Release
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG_NAME#v}"
          chmod +x scripts/package_release.sh
          ./scripts/package_release.sh "$VERSION" "x86_64-unknown-linux-gnu"
      - name: Upload Release Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: docs/RELEASE_NOTES_v0.1.0.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
