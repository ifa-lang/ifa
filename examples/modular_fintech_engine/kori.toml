[package]
name = "modular-fintech-engine"
version = "0.1.0"
edition = "2026"
authors = ["ASSOGBA Prudence Dieudonné <jprud67@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Production-grade multi-module fintech accounting and transaction engine in IFA"

[targets]
bin = [
    { name = "fintech_engine", path = "src/main.ifa" }
]

[profiles.dev]
backend = "cranelift"
opt_level = 0
debug_assertions = true
lto = "none"
strip_symbols = false
gen_checks = true

[profiles.release]
backend = "cranelift"
opt_level = 3
debug_assertions = false
lto = "none"
strip_symbols = true
gen_checks = false
