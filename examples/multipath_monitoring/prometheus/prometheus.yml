global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "ifa-issp-multipath"
    metrics_path: "/metrics"
    scheme: "http"
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ["ifa-telemetry:9100"]
        labels:
          environment: "production"
          service: "ifa-issp-ingress"
